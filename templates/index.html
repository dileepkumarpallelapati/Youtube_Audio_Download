
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Audio Track Download</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8d9d7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #cd9d9d;
            padding: 35px;
            width: 380px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            color: #875a57;
            font-size: 26px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #b53832;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #7a5757;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>YT Audio Track Download</h1>

        <form action="/download" method="POST">
            <input
                type="url"
                name="url"
                placeholder="Paste YouTube video URL here"
                required
            >

            <button type="submit">Download MP3 Audio</button>
        </form>
    </div>
</body>
</html>
